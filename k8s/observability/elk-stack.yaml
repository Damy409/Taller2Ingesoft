apiVersion: v1
kind: ConfigMap
metadata:
  name: elk-logstash-pipeline
  namespace: observability
data:
  logstash.conf: |
    input { beats { port => 5044 } }
    output { stdout { codec => rubydebug } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana-placeholder
  namespace: observability
spec:
  replicas: 1
  selector: { matchLabels: { app: kibana-placeholder } }
  template:
    metadata: { labels: { app: kibana-placeholder } }
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.13.4
        ports: [{ containerPort: 5601 }]
